spring.application.name=19-SpringDataJPA-multiple-database-app

spring.application.name=multiple-database-app

# MySQL Database Configuration
spring.datasource.mysql.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.mysql.username=root
spring.datasource.mysql.password=root

# H2 Database Configuration
spring.datasource.h2.url=jdbc:h2:mem:productdb
spring.datasource.h2.username=sa
spring.datasource.h2.password=
spring.datasource.h2.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console